name: Build SIGSYS Shim PoC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build SIGSYS shim
        run: |
          aarch64-linux-gnu-gcc -fPIC -shared -O2 -Wall -o sigsys_shim.so sigsys_shim.c
          file sigsys_shim.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigsys-shim-poc
          path: sigsys_shim.so
          retention-days: 7
