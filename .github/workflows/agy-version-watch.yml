name: agy Version Watch

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch upstream latest version (google-antigravity)
        id: latest
        run: |
          set -eu
          latest=$(gh api repos/google-antigravity/antigravity-cli/releases/latest --jq '.tag_name')
          if [ -z "$latest" ]; then
            echo "ERROR: Failed to fetch latest version from upstream" >&2
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check current verified version
        id: verified
        run: |
          set -eu
          verified=$(node -p "require('./config/agy-verified-versions.json').verified_version")
          echo "version=$verified" >> "$GITHUB_OUTPUT"
          echo "Current verified version: $verified"

      - name: Determine mode (skip_uptodate / skip_pending / new_intake)
        id: mode
        run: |
          set -eu
          latest="${{ steps.latest.outputs.version }}"
          verified="${{ steps.verified.outputs.version }}"
          branch="automation/agy-${latest}"

          if [ "$latest" = "$verified" ]; then
            echo "mode=skip_uptodate" >> "$GITHUB_OUTPUT"
            echo "Already verified: $latest == $verified"
          elif gh pr list --base main --head "$branch" --state open --json number --jq 'length' | grep -q '^0$' || [ $(gh pr list --base main --head "$branch" --state open --json number --jq 'length') -gt 0 ]; then
            if [ $(gh pr list --base main --head "$branch" --state open --json number --jq 'length') -gt 0 ]; then
              echo "mode=skip_pending" >> "$GITHUB_OUTPUT"
              echo "Open PR already exists for $latest"
            else
              echo "mode=new_intake" >> "$GITHUB_OUTPUT"
              echo "New version to intake: $latest"
            fi
          else
            echo "mode=new_intake" >> "$GITHUB_OUTPUT"
            echo "New version to intake: $latest"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare candidate metadata
        if: steps.mode.outputs.mode == 'new_intake'
        run: |
          set -eu
          version="${{ steps.latest.outputs.version }}"
          node scripts/prepare-agy-candidate.js "$version" > /tmp/candidate.json
          echo "Candidate metadata:"
          cat /tmp/candidate.json

      - name: Update candidate config
        if: steps.mode.outputs.mode == 'new_intake'
        run: |
          set -eu
          node scripts/update-agy-candidate-config.js < /tmp/candidate.json
          echo "Candidate config updated"

      - name: Commit and create PR
        if: steps.mode.outputs.mode == 'new_intake'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ steps.latest.outputs.version }}"
          branch="automation/agy-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          git add config/agy-candidate-version.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Track agy ${version} candidate"
          git push --force-with-lease origin "$branch"

          # Prepare PR body with candidate metadata
          candidate=$(cat config/agy-candidate-version.json)
          sha256_tar=$(echo "$candidate" | jq -r '.sha256_tar')
          sha256_bin=$(echo "$candidate" | jq -r '.sha256_binary')
          va39_counts=$(echo "$candidate" | jq -c '.va39_patch_counts')
          va39_regression=$(echo "$candidate" | jq -c '.va39_patch_regression // []')

          pr_body=$(cat <<EOF
          Automated upstream agy intake from google-antigravity/antigravity-cli

          **Candidate Version:** ${version}
          **SHA256 (tarball):** \`${sha256_tar}\`
          **SHA256 (binary):** \`${sha256_bin}\`
          **VA39 Patch Counts:** \`${va39_counts}\`
          EOF
          )

          if [ "$(echo "$va39_regression" | jq 'length')" -gt 0 ]; then
            pr_body="$pr_body

          ⚠️ **VA39 Patch Regression Detected:**
          $(echo "$va39_regression" | jq -r '.[] | "- " + .')"
          fi

          pr_body="$pr_body

          **Action Required:**
          ⚠️ Device A/B TUI verification is mandatory. After verification:

          1. Run manual verification on devices
          2. Once verified, execute:
             \`\`\`
             scripts/promote-agy-candidate.js ${version} --confirm-device-verified
             \`\`\`
          3. Commit and merge the promotion PR
          4. Only then: \`npm publish\`

          ⚠️ **Do not npm publish until device verification is complete and promotion script executed.**
          ⚠️ **This PR does not trigger npm publish - manual steps required.**
          EOF
          )

          existing=$(gh pr list --base main --head "$branch" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Track agy ${version} candidate" \
              --reviewer bash0816 \
              --body "$pr_body"
          fi
