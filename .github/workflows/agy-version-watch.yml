name: agy Version Watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch latest wallentx release
        id: latest
        run: |
          set -eu
          tag=$(gh api repos/wallentx/antigravity-cli-termux/releases/latest --jq '.tag_name')
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "ERROR: could not fetch latest version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest wallentx release: $version"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check current version
        id: current
        run: |
          set -eu
          current=$(node -p "require('./lib/config').AGY_VERSION")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "Current package version: $current"

      - name: Determine if update needed
        id: mode
        run: |
          set -eu
          latest="${{ steps.latest.outputs.version }}"
          current="${{ steps.current.outputs.version }}"
          branch="automation/agy-${latest}"
          if [ "$latest" = "$current" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $current"
          elif git ls-remote --heads origin "$branch" | grep -q .; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Branch already exists: $branch"
          else
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "New version detected: $latest"
          fi

      - name: Download and verify tarball
        if: steps.mode.outputs.mode == 'update'
        id: verify
        run: |
          set -eu
          tag="${{ steps.latest.outputs.tag }}"
          version="${{ steps.latest.outputs.version }}"
          url="https://github.com/wallentx/antigravity-cli-termux/releases/download/${tag}/antigravity-termux-standalone.tar.gz"

          echo "Downloading $url ..."
          curl -fsSL -o /tmp/agy-standalone.tar.gz "$url"

          sha256_tar=$(sha256sum /tmp/agy-standalone.tar.gz | cut -d' ' -f1)
          echo "SHA256 tarball: $sha256_tar"

          tar -xzf /tmp/agy-standalone.tar.gz -C /tmp agy.va39
          sha256_va39=$(sha256sum /tmp/agy.va39 | cut -d' ' -f1)
          echo "SHA256 agy.va39: $sha256_va39"

          gh attestation verify /tmp/agy-standalone.tar.gz -R wallentx/antigravity-cli-termux
          echo "Attestation verified"

          echo "sha256_tar=$sha256_tar" >> "$GITHUB_OUTPUT"
          echo "sha256_va39=$sha256_va39" >> "$GITHUB_OUTPUT"
          echo "download_url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update config.js
        if: steps.mode.outputs.mode == 'update'
        run: |
          set -eu
          version="${{ steps.latest.outputs.version }}"
          tag="${{ steps.latest.outputs.tag }}"
          sha256_tar="${{ steps.verify.outputs.sha256_tar }}"
          sha256_va39="${{ steps.verify.outputs.sha256_va39 }}"
          url="${{ steps.verify.outputs.download_url }}"

          node - <<NODE
          const fs = require('fs');
          let src = fs.readFileSync('lib/config.js', 'utf8');
          src = src.replace(/AGY_VERSION: '[^']*'/, \`AGY_VERSION: '${version}'\`);
          src = src.replace(/DOWNLOAD_URL: '[^']*'/, \`DOWNLOAD_URL: '${url}'\`);
          src = src.replace(/SHA256_TAR: '[^']*'/, \`SHA256_TAR: '${sha256_tar}'\`);
          src = src.replace(/SHA256_VA39: '[^']*'/, \`SHA256_VA39: '${sha256_va39}'\`);
          fs.writeFileSync('lib/config.js', src);
          NODE

          node - <<NODE
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${version}';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          echo "Updated config.js and package.json to $version"

      - name: Commit and create PR
        if: steps.mode.outputs.mode == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ steps.latest.outputs.version }}"
          branch="automation/agy-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          git add lib/config.js package.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Track agy ${version} from wallentx"
          git push --force-with-lease origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Track agy ${version} from wallentx" \
            --reviewer bash0816 \
            --body "$(printf 'Automated agy version intake.\n\n- upstream: wallentx/antigravity-cli-termux@%s\n- sha256 tarball: %s\n- sha256 agy.va39: %s\n- attestation: verified\n\nNext: Device B verification -> merge -> npm publish dispatch' "$version" "${{ steps.verify.outputs.sha256_tar }}" "${{ steps.verify.outputs.sha256_va39 }}")"
