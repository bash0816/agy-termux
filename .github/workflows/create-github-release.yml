name: Create GitHub Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'automation/docs-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from branch
        id: ver
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          branch="$PR_HEAD_REF"
          ver="${branch#automation/docs-}"
          echo "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: cannot extract version from branch: $branch" >&2
            exit 1
          }
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify npm publish exists
        run: |
          set -eu
          ver="${{ steps.ver.outputs.ver }}"
          published=$(npm view "@bash0816/agy-termux@${ver}" version 2>/dev/null || echo "")
          if [ "$published" != "$ver" ]; then
            echo "ERROR: @bash0816/agy-termux@${ver} not on npm" >&2
            exit 1
          fi

      - name: Create GitHub Release
        run: |
          set -eu
          ver="${{ steps.ver.outputs.ver }}"
          tag="v${ver}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
            exit 0
          fi

          release_notes=$(awk -v ver="$ver" '
            /^## / && index($0, "## " ver " ") > 0 { found=1; next }
            found && /^## / { exit }
            found && /^---/ { exit }
            found { print }
          ' RELEASES.md | sed '/^[[:space:]]*$/d')

          if [ -z "$release_notes" ]; then
            release_notes="upstream wallentx/antigravity-cli-termux v${ver} 追従。"
          fi

          npm_latest=$(npm view @bash0816/agy-termux dist-tags.latest 2>/dev/null || echo "")
          if [ "$ver" = "$npm_latest" ]; then
            latest_flag="--latest"
          else
            latest_flag="--latest=false"
          fi

          notes_file=$(mktemp)
          {
            printf "## agy-termux v%s\n\n" "$ver"
            printf "%s\n\n" "$release_notes"
            printf "### Install\n\`\`\`sh\nnpm install -g @bash0816/agy-termux@%s\n\`\`\`\n" "$ver"
          } > "$notes_file"

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "agy-termux v${ver}" \
            --notes-file "$notes_file" \
            --target main \
            $latest_flag

          echo "Created GitHub Release $tag"
