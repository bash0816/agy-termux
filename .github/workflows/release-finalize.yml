name: Release Finalize

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to finalize (e.g. 1.0.10)'
        required: true
      release_notes:
        description: 'Release summary (leave empty for auto)'
        required: false
        default: ''
      release_date:
        description: 'Date for RELEASES.md (YYYY-MM-DD, empty = JST today)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.version }}
      NOTES: ${{ inputs.release_notes }}
      RELEASE_DATE: ${{ inputs.release_date }}
    steps:
      - name: Validate version format
        run: |
          set -eu
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: Invalid version format: $VER" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify npm publish exists
        run: |
          set -eu
          published=$(npm view "@bash0816/agy-termux@${VER}" version 2>/dev/null || echo "")
          if [ "$published" != "$VER" ]; then
            echo "ERROR: @bash0816/agy-termux@${VER} not published on npm" >&2
            exit 1
          fi
          echo "Confirmed: @bash0816/agy-termux@${VER} is published"

      - name: Validate repo metadata
        run: |
          set -eu
          pkg_ver=$(node -p "require('./package.json').version")
          cfg_ver=$(node -p "require('./lib/config').AGY_VERSION")
          if [ "$pkg_ver" != "$VER" ] || [ "$cfg_ver" != "$VER" ]; then
            echo "ERROR: version mismatch — package.json=$pkg_ver config=$cfg_ver input=$VER" >&2
            exit 1
          fi

      - name: Update RELEASES.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -n "${RELEASE_DATE:-}" ]; then
            echo "$RELEASE_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || {
              echo "ERROR: invalid release_date format" >&2; exit 1
            }
            date_str="$RELEASE_DATE"
          else
            date_str=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi

          notes="${NOTES:-}"
          if [ -z "$notes" ]; then
            upstream_body=$(gh api "repos/wallentx/antigravity-cli-termux/releases/tags/v${VER}" --jq '.body' 2>/dev/null || echo "")
            if [ -n "$upstream_body" ]; then
              notes="upstream wallentx/antigravity-cli-termux v${VER} 追従。Termux 実機検証済み。\n\n**Upstream highlights**\n\n${upstream_body}"
            else
              notes="upstream wallentx/antigravity-cli-termux v${VER} 追従。Termux 実機検証済み。"
            fi
          fi

          if grep -qF "## ${VER} " RELEASES.md 2>/dev/null; then
            echo "RELEASES.md already has ${VER} entry, skipping"
          else
            prev_ver=$(node -p "require('./lib/config').AGY_VERSION" 2>/dev/null || echo "")
            rollback_line=""
            if [ -n "$prev_ver" ] && [ "$prev_ver" != "$VER" ]; then
              rollback_line="\n\`\`\`sh\nnpm install -g @bash0816/agy-termux@${prev_ver}\n\`\`\`"
            fi
            entry="## ${VER} — ${date_str} ✅ Current audited / 現在の監査済み版\n\n${notes}\n\n\`\`\`sh\nnpm install -g @bash0816/agy-termux@latest\n\`\`\`\n${rollback_line}\n\n---\n\n"
            printf "%b" "${entry}" > /tmp/new_entry.md
            cat /tmp/new_entry.md RELEASES.md > /tmp/releases_new.md
            mv /tmp/releases_new.md RELEASES.md
            echo "RELEASES.md updated for ${VER}"
          fi

      - name: Commit and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch="automation/docs-${VER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add RELEASES.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update RELEASES for ${VER}"
          git push --force-with-lease origin "$branch"
          existing=$(gh pr list --base main --head "$branch" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs: update RELEASES for ${VER}" \
              --reviewer bash0816 \
              --body "$(printf 'Automated RELEASES.md update for @bash0816/agy-termux@%s.\n\n- [ ] RELEASES.md のハイライトを確認・編集する\n- [ ] マージすると GitHub Release が自動作成されます' "$VER")"
          fi
